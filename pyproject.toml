[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hemolysis-icterus-lipemia-engine"
version = "2.0.0"
description = "HIL-Index Sentinel: Pre-Analytical Specimen Interference & Analyte Correction Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=7,<10", "httpx>=0.27,<1", "fastapi>=0.110,<1", "uvicorn>=0.27,<1"]

[tool.setuptools]
py-modules = ["hil_sentinel", "hil_correction_engine", "hil_trend_tracker", "specimen_quality_scorer", "enrichment", "simulator", "cli"]

[tool.setuptools.packages.find]
include = ["agents*", "hemolysis_icterus_lipemia_agent*"]

[project.scripts]
hemolysis-icterus-lipemia-engine = "hemolysis_icterus_lipemia_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hemolysis-icterus-lipemia-agent"
Repository = "https://github.com/abusuraihsakhri/hemolysis-icterus-lipemia-engine.git"
